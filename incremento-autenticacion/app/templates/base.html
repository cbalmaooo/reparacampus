<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}ReparaCampus{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header class="barra">
    <a class="marca" href="{{ url_for('inicio') }}">ReparaCampus</a>
    {% if g.usuario %}
      <div class="sesion">
        <span>{{ g.usuario['nombre_usuario'] }} <small>({{ g.usuario['rol']|lower }})</small></span>
        <form method="post" action="{{ url_for('auth.logout') }}">
          <button type="submit" class="boton-secundario">Cerrar sesión</button>
        </form>
      </div>
    {% endif %}
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
