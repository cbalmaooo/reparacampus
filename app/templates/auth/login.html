{% extends "base.html" %}
{% block titulo %}Iniciar sesión · ReparaCampus{% endblock %}
{% block contenido %}
<section class="tarjeta-login">
  <h1>Reporta y sigue los daños del campus</h1>
  <p class="ayuda">Ingresa con tu cuenta asignada.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" value="{{ usuario or '' }}" autocomplete="username" required autofocus>
    <label for="contrasena">Contraseña</label>
    <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" required>
    <button type="submit">Iniciar sesión</button>
  </form>
</section>
{% endblock %}
